services:
  - type: web
    name: athenaeum-rag
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/warm_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OMP_NUM_THREADS
        value: "1"
